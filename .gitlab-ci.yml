# ---------------------------------------------------------------------------
# GitLab CI —— GSAuxiliary 的构建与发布流水线
#
# 这一套是照着 .github/workflows/ci.yml + release.yml 搬过来的
# （GitHub 账号 2026-10-18 起被停用，那边已经跑不动了）。
# 行为刻意保持一致，三条理由都写在对应位置：
#
#   1. **不在 push 上跑**（只认 MR / 手动触发 / tag）：
#      日常改动一律本地 `./gradlew :app:assembleRelease` + 真机验完才提交，
#      推上去再编一遍是纯重复；推得勤 + 每次都起 runner 也最招风控。
#      要云端复验时，在流水线页手动触发即可。
#   2. 默认只编 **release**：release 才是要发的包，也是红线校验的对象；
#      debug 包约 11 MB、占产物九成体积，而它从 2.17.1 起不再随 Release 发布。
#   3. **零密钥也能跑**：仓库没配签名变量时会退回 debug 签名，产物只当测试包
#      （见 docs/BUILD.md §8）。但**发版任务不认这个退路** —— 详见 release 作业。
#
# 静态检查（不变量 / 发版说明覆盖 / 免责副本同步 / 死代码 / 开关全链路 / 宿主契约）
# 单独放在第一个 stage：2 秒就能判对错，别浪费 5 分钟构建。
#
# 需要配的 CI 变量见 docs/GITLAB.md §3。
#
# ⚠️ GitLab 的 `script:` 只吃**字符串**（或字符串数组），不吃 `- name: / run:` 那种
#    映射写法 —— 写成那样整条流水线会被 GitLab 判为配置非法、直接拒绝创建。
#    所以每一段都是 `- |` 加一段 shell，段名用注释写。
# ---------------------------------------------------------------------------

stages:
  - check
  - build
  - release

variables:
  # CI runner 在海外，直连 google() / mavenCentral() 比走阿里云镜像更稳更快。
  # 镜像开关见 settings.gradle.kts。
  GS_NO_MIRROR: "1"
  # 发版要打 tag、要看历史，得能取到完整历史
  GIT_DEPTH: "0"
  # runner 里的 locale 有时不是 UTF-8，中文报错信息会变成一堆问号
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  PYTHONIOENCODING: "utf-8"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # API 建的流水线来源是 `api`（不是 `web`）—— 漏了它，
    # `POST /projects/:id/pipeline` 会被 workflow 规则挡掉：
    # "The pipeline did not run. Review the workflow:rules configuration"
    - if: '$CI_PIPELINE_SOURCE == "api"'
    # trigger token 触发（脚本里最常见的「手动跑一次」方式）
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    # 这里**先判空**再匹配：`=~` 碰上未定义/空的变量时判定不可靠，
    # 加上 `$CI_COMMIT_TAG != ""` 才是「真有 tag 才建」。
    #
    # ⚠️ 实测：往 main 推一次仍会留下一条 0 作业的 failed 流水线 ——
    #    但那**不是规则匹配的**（规则只认 MR / web / tag），而是账号级身份验证
    #    那道门在 workflow 规则之前就拦下了，GitLab 于是留了一条失败记录。
    #    验证通过后确认一次即可（那时 push 应该一条都不建）。
    - if: '$CI_COMMIT_TAG != "" && $CI_COMMIT_TAG =~ /^[0-9]+-[0-9]+\.[0-9]+\.[0-9]+$/'
    # 兜底：上面都没命中（= 往 main / 其它分支 push）就整条不跑 —— 理由见文件头第 1 条。
    - when: never

default:
  interruptible: true

# ---------------------------------------------------------------------------
# 第一关：静态检查（源码级，2 秒判对错）
#
# 这一关不需要 JDK、不需要 Android SDK、不需要设备 —— 纯 Python 脚本，
# 所以单独用一个瘦镜像，跑得又快又省。
# ---------------------------------------------------------------------------
static-checks:
  stage: check
  image: python:3.12-slim
  timeout: 10 minutes
  script:
    - |
      # 静态不变量扫描
      # 把文档里写死的规矩变成能跑的检查：Miuix Overlay 禁用、关键状态
      # rememberSaveable、自己的类名当判据要有 proguard keep、功能开关不是
      # 假开关、宿主标识用候选数组、中英资源键对齐、日志不得出现裸代码。
      python3 tools/ci/check_invariants.py
    - |
      # 发版说明覆盖核对
      # `docs/RELEASE.md` 的覆盖率红线：本版全部改动必须进说明。
      # 这条规矩之前没有自动检查 —— 靠人记，结果通常是「想起来才补」。
      python3 tools/ci/check_release_notes.py
    - |
      # 免责声明副本同步核对
      # 免责全文有四个副本（中文 md / 中文资源 / 英文 md / 英文资源）。
      # 「改任何一条都必须一起改」之前只靠人记 —— 真的漂过：
      # 英文那份整段少了第八~第十一条，还留着一句「contains no networking
      # components」，而模块 3.x 明明有 HTTP 取数。
      python3 tools/ci/check_disclaimer_sync.py
    - |
      # 死代码扫描
      # 查「顶层符号谁都没调用」与「只在测试里被调用」——
      # 这项目栽过好几次「名义上存在、实际不生效」（or 链漏一位、锚点没有调用点、
      # 调试通道补了列忘了补值）。`hygiene.py` 只查文件内的 private 成员，跨文件的漏网。
      python3 tools/ci/check_dead_symbols.py
    - |
      # 功能开关全链路校验
      # 一个功能开关要在五处同时存在：ConfigKeys 常量 + DEFAULTS、FEATURE_KEYS、
      # SNAPSHOT_KEYS、ConfigSnapshot 字段、FeatureCatalog 的一行。
      # 缺任何一处的症状都难查（改了开关没反应、没日志）。
      python3 tools/ci/check_switches.py
    - |
      # 文档链接 / 索引 / 孤儿检查
      # Release 说明里的免责链接曾写成 GitHub 的 `../../blob/main/...` ——
      # 在 GitLab 上点不开，而本地 YAML 解析、Markdown 渲染都看不出问题。
      python3 tools/ci/check_links.py
    - |
      # 宿主契约校验
      # 双向校验「代码里认宿主的东西」与「契约清单」：
      # 代码里有而清单里没有 → 忘了登记；清单里有而代码里没了 → 清单失效。
      # 带上宿主类名快照：能**确认**哪些候选名现在还认得到。
      python3 tools/ci/check_contract.py --dump tools/contract/dump/8.6.0-271-classes.txt

# ---------------------------------------------------------------------------
# 第二关：编译 + 单测 + 产物红线
#
# 需要 JDK 17 与 Android SDK —— GitLab 的共享 runner 不预装 SDK，
# 所以装 SDK 的那一步写成了仓库里的脚本（tools/ci/setup-android-sdk.sh），
# 不靠某个第三方 action。
# ---------------------------------------------------------------------------
build:
  stage: build
  image: eclipse-temurin:17-jdk
  needs: ["static-checks"]
  timeout: 60 minutes
  script:
    - |
      # 确认 gradlew 有可执行位
      # 在 Windows 上开发时很容易把它提交成 100644，到 Linux runner 上
      # 就变成一句没头没尾的 `./gradlew: Permission denied`。提前说清楚。
      if [ ! -x ./gradlew ]; then
        echo "[X] gradlew 没有可执行位（git 里必须是 100755）。修：git update-index --chmod=+x gradlew"
        ls -l gradlew
        exit 1
      fi
    - |
      # 装 Android SDK
      # 装 cmdline-tools + platform-tools + build-tools，并把 compileSdk 37
      # 归一成 AGP 8.10.1 认得的目录名（来龙去脉见 docs/BUILD.md §4.1）。
      bash tools/ci/setup-android-sdk.sh
    - |
      # 解码签名密钥（配了才做）
      # ⚠️ 这一步不能省：`GS_KEYSTORE_BASE64` 是**密钥库本体**，而 Gradle 要的是
      # **文件路径**（`GS_KEYSTORE_PATH`）。少这一步，构建就悄悄退回 debug 签名 ——
      # 而下面的红线校验又会因为「配了密钥」要求 release 包不是 debug 签名，
      # 于是必然红（这个坑真踩过：2.15.0 的 CI 就是这么红的）。
      set -e
      if [ -z "${GS_KEYSTORE_BASE64:-}" ]; then
        echo "[i] 没配签名密钥 —— 本次走零密钥路径，release 包会用 debug 签名"
        exit 0
      fi
      printf '%s' "$GS_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$CI_PROJECT_DIR/release.keystore"
      ls -l "$CI_PROJECT_DIR/release.keystore"
      # 顺手验一下密码 / 别名对不对，别等到构建完才发现签名失败
      if ! keytool -list -keystore "$CI_PROJECT_DIR/release.keystore" \
             -storepass "$GS_KEYSTORE_PASSWORD" -alias "$GS_KEYSTORE_ALIAS" >/dev/null 2>&1; then
        echo "[X] keystore 能解开，但密码或别名对不上 —— 检查 GS_KEYSTORE_PASSWORD / GS_KEYSTORE_ALIAS"
        exit 1
      fi
      echo "[OK] keystore 与密码 / 别名匹配"
      export GS_KEYSTORE_PATH="$CI_PROJECT_DIR/release.keystore"
      echo "GS_KEYSTORE_PATH=$GS_KEYSTORE_PATH" >> "$CI_PROJECT_DIR/.ci-env"
    - |
      # 跑单元测试
      # testReleaseUnitTest 与 assembleRelease **共用 compileReleaseKotlin 的产物**，
      # 边际成本 ≈ 数秒。覆盖的是「纯逻辑」那一半的正确性：
      # 配置指纹、筛选语义真值表、日志打码、配置键对齐。
      set -e
      if [ -f "$CI_PROJECT_DIR/.ci-env" ]; then . "$CI_PROJECT_DIR/.ci-env"; fi
      ./gradlew --no-daemon --console=plain :app:testReleaseUnitTest
    - |
      # 确认真的跑了测试
      # 防「测试目录被误删 → 任务成功但一条没跑 → 假绿」
      python3 - <<'PY'
      import glob, xml.etree.ElementTree as ET
      fs = glob.glob("app/build/test-results/testReleaseUnitTest/*.xml")
      n = sum(int(ET.parse(f).getroot().get("tests")) for f in fs)
      print(f"[OK] 跑了 {n} 条用例")
      assert n > 0, "一条用例都没跑 —— 测试源码集可能整目录被删了"
      PY
    - |
      # 构建 release
      set -e
      if [ -f "$CI_PROJECT_DIR/.ci-env" ]; then . "$CI_PROJECT_DIR/.ci-env"; fi
      ./gradlew --no-daemon --console=plain :app:assembleRelease
    - |
      # 校验产物红线
      # 签名证书指纹可选（GS_CERT_SHA256）：钉死它就能挡住「签名悄悄换了」。
      set -e
      if [ -f "$CI_PROJECT_DIR/.ci-env" ]; then . "$CI_PROJECT_DIR/.ci-env"; fi
      EXTRA=()
      if [ -n "${GS_KEYSTORE_BASE64:-}" ]; then
        # 配了签名密钥 —— release 包就不该再是 debug 签名，踩到直接红。
        echo "已配置签名密钥：release 包不允许退回 debug 签名"
        EXTRA+=(--reject-debug-cert)
      else
        echo "未配置签名密钥（零密钥 CI）：release 包会用 debug 签名，只提醒不报错"
      fi
      if [ -n "${GS_CERT_SHA256:-}" ]; then
        EXTRA+=(--expect-cert-sha256 "$GS_CERT_SHA256")
      fi
      python3 tools/ci/verify_apk.py "${EXTRA[@]}" app/build/outputs/apk/release/app-release.apk
    - |
      # 整理产物
      # 就算上面红线校验红了，也要把 APK 留下来 —— 那正是排查要用的东西
      mkdir -p dist
      VC="$(python3 tools/ci/version.py | sed -n 's/^vc=//p')"
      VN="$(python3 tools/ci/version.py | sed -n 's/^vn=//p')"
      cp app/build/outputs/apk/release/app-release.apk "dist/GSAuxiliary_${VC}-${VN}.apk"
      # R8 的混淆映射：release 崩溃栈要靠它还原成可读的类名 / 行号
      if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
        cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
      fi
      ls -l dist || true
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# ---------------------------------------------------------------------------
# 第三关：发版 —— 建 GitLab Release + 挂 APK
#
# 触发方式：推一个形如 `48-3.3.0` 的 tag（tag 必须与 app/build.gradle.kts 里的
# versionCode-versionName 一致，本作业第一件事就是查这个）。
#
# 为什么用 `CI_JOB_TOKEN` 而不是 Personal Access Token：
#   同项目内的作业令牌就能建 Release、传附件 —— 不必在 GitLab 上再存一份
#   长期有效的凭据。凭据有效期的问题因此少了一半。
#
# ⚠️ 与 GitHub 那边的 release.yml 一个脾气：**签名密钥不齐就报错退出**，
#    绝不发出一个 debug 签名的包 —— 那会让所有已装用户被迫卸载重装。
# ---------------------------------------------------------------------------
release:
  stage: release
  image: eclipse-temurin:17-jdk
  needs: ["build"]
  timeout: 20 minutes
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+-[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - |
      # 装 curl + python3：eclipse-temurin 镜像里两个都没有。
      # ⚠️ **每个作业都是全新的容器** —— build 作业里 apt 装的 python3 不会留到这里，
      #    各作业得各装各的（踩过：release 作业挂在 python3: command not found）。
      apt-get update -qq
      apt-get install -y -qq curl python3 > /dev/null
  script:
    - |
      # 校验 tag 与版本号一致
      # 不一致直接失败 —— 防止给一个还没完工的版本建出假 Release
      set +e
      OUT="$(python3 tools/ci/version.py --check-tag "$CI_COMMIT_TAG" 2>&1)"
      rc=$?
      set -e
      echo "$OUT"
      [ "$rc" -eq 0 ] || exit 1
    - |
      # 检查签名密钥齐不齐
      if [ -z "${GS_KEYSTORE_BASE64:-}" ] || [ -z "${GS_KEYSTORE_PASSWORD:-}" ] \
         || [ -z "${GS_KEYSTORE_ALIAS:-}" ] || [ -z "${GS_KEYSTORE_KEY_PASSWORD:-}" ]; then
        echo "[X] 缺少签名相关的 CI 变量（GS_KEYSTORE_BASE64 / GS_KEYSTORE_PASSWORD /"
        echo "    GS_KEYSTORE_ALIAS / GS_KEYSTORE_KEY_PASSWORD），不发布 ——"
        echo "    宁可没有 Release，也不要发一个 debug 签名的包让用户卸载重装。"
        echo "    怎么配见 docs/GITLAB.md §3。"
        exit 1
      fi
      echo "[OK] 签名变量都在"
    - |
      # 建 Release 并上传 APK
      set -euo pipefail
      TAG="$CI_COMMIT_TAG"
      VN="$(python3 tools/ci/version.py | sed -n 's/^vn=//p')"
      NOTES_FILE="docs/release-notes/$VN.md"
      if [ -f "$NOTES_FILE" ]; then
        NOTES="$(cat "$NOTES_FILE")"
      else
        echo "[!] $NOTES_FILE 不存在，退回用 CHANGELOG 的 [$VN] 段当说明（面向开发者，偏噪音）。见 docs/RELEASE.md §2"
        # 复用 publish.py 里已有的抽取逻辑 —— 同一段正则不写两遍
        # （tools/ 下的规矩：逻辑出现 2 处就抽公共实现，见 TOOLS-DOC-RULES.md §5）
        NOTES="$(python3 -c "import sys; sys.path.insert(0,'tools'); import publish; print(publish.notes_from_changelog('$VN'))")"
      fi

      API="https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases"
      echo "[1/2] 建 Release $TAG"
      # 已存在就更新说明（幂等：同一个 tag 重跑一次不会 409 炸掉）
      code="$(curl -s -o /tmp/rel.json -w '%{http_code}' \
               --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --data-urlencode "name=$TAG" \
               --data-urlencode "tag_name=$TAG" \
               --data-urlencode "description=$NOTES" \
               "$API")"
      case "$code" in
        200|201) echo "    [OK] Release 已建（HTTP $code）" ;;
        409)
          echo "    [i] Release 已存在，改成更新说明"
          curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --request PUT \
               --data-urlencode "name=$TAG" \
               --data-urlencode "description=$NOTES" \
               "$API/$TAG" > /dev/null
          ;;
        *) echo "[X] 建 Release 失败（HTTP $code）："; cat /tmp/rel.json; exit 1 ;;
      esac

      echo "[2/2] 上传 APK 附件"
      APK="dist/GSAuxiliary_$TAG.apk"
      [ -f "$APK" ] || { echo "[X] 找不到 $APK"; ls -l dist || true; exit 1; }

      # 附件是**两步**（与 tools/publish_gitlab.py 同一份做法）：
      #   1. POST /projects/:id/uploads                   —— 传到项目 uploads，拿 full_path
      #   2. POST /projects/:id/releases/:tag/assets/links —— 挂成 Release 的下载链接
      # ⚠️ 之前用的 /releases/:tag/assets/uploads 在这个 GitLab 版本上是 **404**。
      # ⚠️ 第 2 步是 **POST**（新建）；PUT 是更新，会 404。
      UPLOAD_PATH="$(curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --form "file=@$APK" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/uploads" \
        | python3 -c 'import sys,json; print(json.load(sys.stdin)["full_path"])')"
      ASSET_URL="https://gitlab.com$UPLOAD_PATH"
      echo "    上传到：$ASSET_URL"

      # 同名资产先删再挂（重跑不会挂出两个一样的）
      # ⚠️ python 只用单行 —— YAML 块标量里**顶格的行会把整个块截断**
      for lid in $(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases/$TAG/assets/links" \
          | python3 -c 'import sys,json; [print(a["id"]) for a in json.load(sys.stdin) if a.get("name")==sys.argv[1]]' "$(basename "$APK")"); do
        curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --request DELETE \
          "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases/$TAG/assets/links/$lid" > /dev/null \
          && echo "    删掉同名旧资产 id=$lid"
      done

      curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=$(basename "$APK")" \
        --data-urlencode "url=$ASSET_URL" \
        --data-urlencode "link_type=package" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases/$TAG/assets/links" > /tmp/asset.json
      cat /tmp/asset.json
      echo ""
      echo "[OK] Release: https://gitlab.com/$CI_PROJECT_PATH/-/releases/$TAG"
  artifacts:
    paths:
      - dist/
    expire_in: 90 days

# ---------------------------------------------------------------------------
# 临时冒烟作业：验证「用 CI_JOB_TOKEN 建/改 Release + 传附件」这条链路
# （真发版只会在 tag 上跑；这里用已发布的 48-3.3.0 重挂一次 mapping，
#   不碰已发布的 APK —— 目的是验证 JOB-TOKEN 与那两个接口的用法）
# ---------------------------------------------------------------------------
release-smoke:
  stage: release
  image: eclipse-temurin:17-jdk
  needs: ["build"]
  when: manual
  before_script:
    - |
      # 同样的理由：每个作业都是全新容器，python3 得自己装
      apt-get update -qq
      apt-get install -y -qq curl python3 > /dev/null
  script:
    - |
      set -euo pipefail
      TAG="48-3.3.0"
      API="https://gitlab.com/api/v4/projects/$CI_PROJECT_ID"
      echo "[1/3] 建/改 Release（用 JOB-TOKEN）"
      code="$(curl -s -o /tmp/rel.json -w '%{http_code}'         --header "JOB-TOKEN: $CI_JOB_TOKEN"         --data-urlencode "name=$TAG"         --data-urlencode "tag_name=$TAG"         --data-urlencode "description=冒烟测试（内容会被下一次正式发版覆盖）"         "$API/releases")"
      case "$code" in
        200|201) echo "    [OK] 已建（HTTP $code）" ;;
        409)
          echo "    [i] 已存在，改成更新"
          curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --request PUT             --data-urlencode "name=$TAG"             --data-urlencode "description=冒烟测试（内容会被下一次正式发版覆盖）"             "$API/releases/$TAG" > /dev/null
          echo "    [OK] 已更新"
          ;;
        *) echo "[X] 失败（HTTP $code）："; cat /tmp/rel.json; exit 1 ;;
      esac
      echo "[2/3] 传到项目 uploads"
      UPLOAD_PATH="$(curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"         --form "file=@dist/mapping.txt"         "$API/uploads"         | python3 -c 'import sys,json; print(json.load(sys.stdin)["full_path"])')"
      echo "    上传到：$UPLOAD_PATH"
      echo "[3/3] 挂成 Release 资产"
      curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"         --data-urlencode "name=mapping-smoke.txt"         --data-urlencode "url=https://gitlab.com$UPLOAD_PATH"         --data-urlencode "link_type=other"         "$API/releases/$TAG/assets/links" > /tmp/asset.json
      cat /tmp/asset.json
      echo ""
      # 冒烟产物立刻删掉，不留在 Release 上
      LID="$(python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])' < /tmp/asset.json)"
      curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --request DELETE         "$API/releases/$TAG/assets/links/$LID" > /dev/null && echo "[OK] 冒烟资产已删除（id=$LID）"
      # 说明文字恢复成正式版
      curl -s --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --request PUT         --data-urlencode "name=3.3.0"         --data-urlencode "description=$(cat docs/release-notes/3.3.0.md)"         "$API/releases/$TAG" > /dev/null && echo "[OK] Release 说明已恢复"
