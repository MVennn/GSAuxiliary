# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 37 是 Miuix 0.9.3 的硬性要求，AGP 8.10.1 尚未把它列为"已支持"，
# 这里显式关掉告警。详见 docs/BUILD.md
android.suppressUnsupportedCompileSdk=37,37.0

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
# 让 Kotlin 编译器在 Gradle 守护进程内运行，不再单起一个常驻的 Kotlin 编译守护进程
# （那个进程带 -Dkotlin.environment.keepalive，构建结束后不会自己退出，只能手动杀）。
# 配合 ~/.gradle/gradle.properties 的 idletimeout=10000，构建结束后不会遗留任何 JVM。
kotlin.compiler.execution.strategy=in-process
# AGP 8.10.1 要求 Gradle 8.11.x；KGP 2.4 会提示"建议升到 8.14.4"，此处静音
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
