name: Release

# ---------------------------------------------------------------------------
# 推一个 tag（形如 34-2.14.0）就发一版：
#
#   1. 校验 tag 与 app/build.gradle.kts 的 versionCode-versionName 完全一致
#      （不一致直接失败 —— 防止给一个还没完工的版本建出假 Release）
#   2. 检查 5 个 Secrets 齐全，并**提前**确认 token 对两个仓库都有写权限
#   3. 用 Secrets 里的 keystore 签名构建 release
#   4. 跑红线校验（含「签名证书不能是 Android 调试证书」这条硬校验）
#   5. 调 tools/publish.py 一次发到「源码仓库」+「LSPosed 模块仓库」，并同步元文件
#
# ⚠️ 为什么第 5 步必须两个仓库一起发：见 docs/RELEASE.md §0 ——
#    只发源码仓库，modules.lsposed.org 与 LSPosed App 收不到任何东西，
#    用户拿不到更新。所以本工作流**要求** LSPOSED_REPO_TOKEN，缺了就报错退出，
#    不会给你一个「看着成功、实际用户收不到」的假象。
#
# 需要的 Repository secrets（5 个，另有一个可选的 GS_CERT_SHA256）见 docs/RELEASE.md §1.2。
#
# 手动触发时可以把 dry_run 打开，整条流水线只「演一遍」：照常构建、照常校验，
# 但不往任何仓库写东西。
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - '[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 34-2.14.0，必须已经存在）'
        required: true
        type: string
      dry_run:
        description: '只演练不发布（照常构建 + 校验，但不写任何仓库）'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 本工作流对 GitHub API 的写操作全部走 LSPOSED_REPO_TOKEN（PAT），
# 不用 Actions 自带的 GITHUB_TOKEN —— 所以这里只要读权限就够了。
permissions:
  contents: read

jobs:
  release:
    name: 构建并双仓库发布
    # 钉 24.04 而不是 ubuntu-latest：后者从 2026-10-19 起迁往 Ubuntu 26，
    # 迁移期的镜像差异不该出现在发版结果里。等 26 稳了再手动改这一行。
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      GS_NO_MIRROR: '1'
      # 签名：这四个变量由 app/build.gradle.kts 直接读（见该文件「签名配置」段），
      # 所以必须在 job 级 env —— Gradle 进程要能看见。
      GS_KEYSTORE_BASE64: ${{ secrets.GS_KEYSTORE_BASE64 }}
      GS_KEYSTORE_PASSWORD: ${{ secrets.GS_KEYSTORE_PASSWORD }}
      GS_KEYSTORE_ALIAS: ${{ secrets.GS_KEYSTORE_ALIAS }}
      GS_KEYSTORE_KEY_PASSWORD: ${{ secrets.GS_KEYSTORE_KEY_PASSWORD }}
      # 要发布的 tag：手动触发用输入值，推 tag 用 ref 名。
      # 走 env 而不是直接塞进 shell —— tag 是外部字符串，不该拼进命令行。
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          # 发布用的是 PAT（见下面的 GS_GITHUB_TOKEN），不需要 checkout 留下的凭据
          persist-credentials: false

      # ---------------------------------------------------------- 先失败，再干活
      # 下面几步都是「几秒就能判定、判错了却要浪费 5 分钟构建」的检查，
      # 所以全部排在装 JDK / SDK 之前。

      - name: 确认 gradlew 有可执行位
        run: |
          if [ ! -x ./gradlew ]; then
            echo "::error file=gradlew::gradlew 没有可执行位（git 里必须是 100755）。修：git update-index --chmod=+x gradlew"
            ls -l gradlew
            exit 1
          fi

      - name: 校验 tag 与版本号一致
        run: |
          set +e
          OUT="$(python3 tools/ci/version.py --check-tag "$RELEASE_TAG" 2>&1)"
          rc=$?
          set -e
          echo "$OUT"
          if [ "$rc" -ne 0 ]; then
            {
              echo "## ❌ tag 与版本号对不上"
              echo ""
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
              echo "先改 \`app/build.gradle.kts\` 的 versionCode / versionName，再打 tag。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 检查发布所需的 Secrets
        env:
          LSPOSED_REPO_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
        run: |
          missing=()
          [ -n "${GS_KEYSTORE_BASE64:-}" ]       || missing+=("GS_KEYSTORE_BASE64")
          [ -n "${GS_KEYSTORE_PASSWORD:-}" ]     || missing+=("GS_KEYSTORE_PASSWORD")
          [ -n "${GS_KEYSTORE_ALIAS:-}" ]        || missing+=("GS_KEYSTORE_ALIAS")
          [ -n "${GS_KEYSTORE_KEY_PASSWORD:-}" ] || missing+=("GS_KEYSTORE_KEY_PASSWORD")
          [ -n "${LSPOSED_REPO_TOKEN:-}" ]       || missing+=("LSPOSED_REPO_TOKEN")

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## ❌ 缺少 Repository secrets"
              echo ""
              echo '```'
              printf '%s\n' "${missing[@]}"
              echo '```'
              echo ""
              echo "到 **Settings → Secrets and variables → Actions** 补齐后重跑。"
              echo "每个 secret 怎么造，见 \`docs/RELEASE.md\` §1.2。"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '[X] 缺少 secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "[OK] 5 个 secrets 都在"

      - name: 前置检查 —— token 对两个仓库都有写权限吗
        # publish.py 是先发源码仓库、再发模块仓库。如果 token 写不了模块仓库，
        # 源码仓库那份已经建好了、用户却什么都收不到 —— 提前拦住，别浪费一次构建。
        env:
          GS_GITHUB_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
        run: python3 tools/publish.py --check

      # ---------------------------------------------------------------- 环境

      - name: 装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: 装 compileSdk 37 平台
        run: bash tools/ci/setup-sdk37.sh

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: 解码签名密钥
        run: |
          printf '%s' "$GS_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -l "$RUNNER_TEMP/release.keystore"
          # 顺手验一下密码 / 别名对不对，别等到构建完才发现签名失败
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                 -storepass "$GS_KEYSTORE_PASSWORD" -alias "$GS_KEYSTORE_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 能解开，但密码或别名对不上 —— 检查 GS_KEYSTORE_PASSWORD / GS_KEYSTORE_ALIAS"
            exit 1
          fi
          echo "[OK] keystore 与密码 / 别名匹配"
          echo "GS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # ---------------------------------------------------------- 构建与校验

      - name: 构建 release
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: 校验产物红线
        env:
          # 可选：钉死签名证书指纹（没配就只把实际值打印出来，人工核对）
          GS_EXPECT_CERT_SHA256: ${{ secrets.GS_CERT_SHA256 }}
        run: |
          # --reject-debug-cert 是这里的关键守卫：只要 app/build.gradle.kts 因为
          # 任何原因退回了 debug 签名（比如某个 GS_KEYSTORE_* 没传到 Gradle），
          # 这一步直接红 —— 而不是签出一个「签名和以前不一样」的包让所有用户重装。
          python3 tools/ci/verify_apk.py --reject-debug-cert \
            app/build/outputs/apk/release/app-release.apk

      - name: 整理产物
        if: always()
        run: |
          mkdir -p dist
          TAG="$(python3 tools/ci/version.py --tag)"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/GSAuxiliary_${TAG}.apk"
          fi
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          ls -l dist || true

      # ---------------------------------------------------------------- 发布

      - name: 发布到两个仓库
        env:
          # publish.py 优先读 GS_GITHUB_TOKEN（需要 repo scope，且对模块仓库有写权限）
          GS_GITHUB_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
        run: |
          VN="$(python3 tools/ci/version.py | sed -n 's/^vn=//p')"

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "::notice::dry_run 已打开 —— 只演练，不往任何仓库写东西"
            python3 tools/publish.py --dry-run
            exit 0
          fi

          NOTES="docs/release-notes/$VN.md"
          if [ -f "$NOTES" ]; then
            echo "用 $NOTES 作为 Release 说明"
            python3 tools/publish.py --skip-build --notes "$NOTES"
          else
            echo "::warning::$NOTES 不存在，退回用 CHANGELOG 的 [$VN] 段当说明（面向开发者，偏噪音）。见 docs/RELEASE.md §2"
            python3 tools/publish.py --skip-build
          fi

      - name: 留一份产物
        if: always()
        # v7 起跑在 Node 24。v5 是 node20 的，runner 会强制用 Node 24 跑它并
        # 在每次运行上挂一条弃用警告 —— 别退回 v5。
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: ignore
          retention-days: 30
