name: CI

# ---------------------------------------------------------------------------
# **不在 push 上跑**：只在开 PR、或到 Actions 页面手动触发时完整编译一遍，
# 并把 docs/BUILD.md 里那几条「红线」固化成自动校验（tools/ci/verify_apk.py）。
#
# 为什么去掉 push 触发（2026-10-18）：
#   1. 日常改动一律在本地 `./gradlew.bat :app:assembleRelease` + 真机验证完才提交，
#      推上去再编一遍是纯重复；
#   2. 推得勤 + 每次推都起一次 runner，是账号风控最容易盯上的模式
#      （同一天内频繁 push 触发大量构建）。
#   要云端复验时手动触发即可；发版的构建与红线校验在 release.yml 里另有一整套，
#   不依赖本工作流。
#
# 默认只编 **release**，理由有两条：
#   1. release 才是要发的包，也是红线校验的对象；
#   2. debug 包约 11 MB，占产物九成体积 —— 而它从 2.17.1 起已经不再随 Release
#      发布（见 CHANGELOG），日常没人下载。要拿它装真机排查时，到 Actions 页面
#      手动触发本工作流、勾上 build_debug 即可。
#
# 这一套是**零密钥**的：仓库没配任何 Secret 也能跑，release 会退回 debug 签名，
# 产物只当测试包用（见 docs/BUILD.md §8）。
#
# 产物**无论成败都上传** —— 红线校验没过时，APK 正是排查要用的东西。
# ---------------------------------------------------------------------------

on:
  pull_request:
  # 手动触发才编。push 分支被有意去掉，理由见文件头。

  workflow_dispatch:
    inputs:
      build_debug:
        description: '连 debug 包一起编（约 11 MB；只有要拿它装真机排查时才勾）'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建 release
    # 钉 24.04 而不是 ubuntu-latest：后者从 2026-10-19 起迁往 Ubuntu 26，
    # 迁移期的镜像差异不该体现在构建结果里。等 26 稳了再手动改这一行。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # CI runner 在海外，直连 google() / mavenCentral() 比走阿里云镜像更稳更快。
      # 镜像开关见 settings.gradle.kts。
      GS_NO_MIRROR: '1'
      # 签名：这四个由 app/build.gradle.kts 直接读（见该文件「签名配置」段）。
      # 没配密钥时它们全是空串 —— `takeIf { it.isNotBlank() }` 会把空串当「没给」，
      # 于是退回 AGP 自带的 debug 签名，下面的红线校验也会相应放宽。
      # （fork 提的 PR 拿不到 secrets，走的正是这条零密钥路径。）
      GS_KEYSTORE_BASE64: ${{ secrets.GS_KEYSTORE_BASE64 }}
      GS_KEYSTORE_PASSWORD: ${{ secrets.GS_KEYSTORE_PASSWORD }}
      GS_KEYSTORE_ALIAS: ${{ secrets.GS_KEYSTORE_ALIAS }}
      GS_KEYSTORE_KEY_PASSWORD: ${{ secrets.GS_KEYSTORE_KEY_PASSWORD }}
      # 手动触发时勾了才编 debug。push / PR 触发时这个值是空串，
      # 下面按 `= "true"` 判定，天然为假。
      BUILD_DEBUG: ${{ inputs.build_debug }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          # 这个 job 只读不写，没必要把 token 留在 .git/config 里
          persist-credentials: false

      - name: 确认 gradlew 有可执行位
        # 在 Windows 上开发时很容易把它提交成 100644，到 Linux runner 上
        # 就变成一句没头没尾的 `./gradlew: Permission denied`。提前说清楚。
        run: |
          if [ ! -x ./gradlew ]; then
            echo "::error file=gradlew::gradlew 没有可执行位（git 里必须是 100755）。修：git update-index --chmod=+x gradlew"
            ls -l gradlew
            exit 1
          fi

      - name: 装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # build-tools 35.0.0 是 AGP 8.10.1 的默认版本，显式装掉省得构建时再下载
          packages: 'platform-tools build-tools;35.0.0'

      # compileSdk 37 在官方仓库里叫 platforms;android-37.2，AGP 8.10.1 认不出这个
      # 新命名，必须归一化一次。来龙去脉见 docs/BUILD.md §4.1。
      - name: 装 compileSdk 37 平台
        run: bash tools/ci/setup-sdk37.sh

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v5
        with:
          # 顺手校验 gradle-wrapper.jar 的 checksum，防止被替换
          validate-wrappers: true

      - name: 读版本号
        id: ver
        run: python3 tools/ci/version.py >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 静态不变量扫描 —— **最先跑**：2 秒就能判对错，别浪费 5 分钟构建。
      #
      # 它把文档里写死的规矩变成能跑的检查（Miuix Overlay 禁用、关键状态
      # rememberSaveable、自己的类名当判据要有 proguard keep、功能开关不是
      # 假开关、宿主标识用候选数组、中英资源键对齐、日志不得出现裸代码）。
      #
      # 四轮审查每一轮「优化」都引入了新 bug，而当时全靠真机人工验兜底 ——
      # 这一层是**源码级**的，不需要设备也不需要构建。
      # ------------------------------------------------------------------
      - name: 静态不变量扫描
        run: python3 tools/ci/check_invariants.py

      - name: 功能开关全链路校验
        # 一个功能开关要在五处同时存在：ConfigKeys 常量 + DEFAULTS、FEATURE_KEYS、
        # SNAPSHOT_KEYS、ConfigSnapshot 字段、FeatureCatalog 的一行。
        # 缺任何一处的症状都难查（改了开关没反应、没日志）——
        # 而「一个 Feature 承载多个开关」时，最容易漏的就是 FEATURE_KEYS 与 isEnabled 那一处。
        run: python3 tools/ci/check_switches.py

      - name: 宿主契约校验
        # 双向校验「代码里认宿主的东西」与「契约清单」：
        # 代码里有而清单里没有 → 忘了登记；清单里有而代码里没了 → 清单失效。
        # 宿主升级后靠它知道「哪个候选名可能已经不管用了」——
        # 否则只能等用户在真机上发现「这个功能不生效了」再回头猜。
        # 带上宿主类名快照：能**确认**哪些候选名现在还认得到。
        # （dump 覆盖不全，所以「不在里面」只提示不报错 —— 详见 tools/contract/dump/README.md）
        run: python3 tools/ci/check_contract.py --dump tools/contract/dump/8.6.0-271-classes.txt

      # ⚠️ 这一步不能省：`GS_KEYSTORE_BASE64` 是**密钥库本体**，而 Gradle 要的是
      # **文件路径**（`GS_KEYSTORE_PATH`）。少这一步，构建就悄悄退回 debug 签名 ——
      # 而下面的红线校验又会因为「配了密钥」要求 release 包不是 debug 签名，
      # 于是必然红（这个坑真踩过：2.15.0 的 CI 就是这么红的）。
      - name: 解码签名密钥（配了才做）
        if: env.GS_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$GS_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -l "$RUNNER_TEMP/release.keystore"
          # 顺手验一下密码 / 别名对不对，别等到构建完才发现签名失败
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                 -storepass "$GS_KEYSTORE_PASSWORD" -alias "$GS_KEYSTORE_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 能解开，但密码或别名对不上 —— 检查 GS_KEYSTORE_PASSWORD / GS_KEYSTORE_ALIAS"
            exit 1
          fi
          echo "[OK] keystore 与密码 / 别名匹配"
          echo "GS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: 跑单元测试
        # testReleaseUnitTest 与 assembleRelease **共用 compileReleaseKotlin 的产物**，
        # 边际成本 ≈ 数秒。覆盖的是「纯逻辑」那一半的正确性：
        # 配置指纹、筛选语义真值表、日志打码、配置键对齐。
        run: ./gradlew --no-daemon --console=plain :app:testReleaseUnitTest

      - name: 确认真的跑了测试
        # 防「测试目录被误删 → 任务成功但一条没跑 → 假绿」
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          fs = glob.glob("app/build/test-results/testReleaseUnitTest/*.xml")
          n = sum(int(ET.parse(f).getroot().get("tests")) for f in fs)
          print(f"[OK] 跑了 {n} 条用例")
          assert n > 0, "一条用例都没跑 —— 测试源码集可能整目录被删了"
          PY

      - name: 构建
        run: |
          TASKS=(assembleRelease)
          if [ "$BUILD_DEBUG" = "true" ]; then
            echo "手动触发且勾了 build_debug —— 连 debug 一起编"
            TASKS+=(assembleDebug)
          fi
          ./gradlew --no-daemon --console=plain "${TASKS[@]}"

      - name: 校验产物红线
        env:
          # 可选：钉死签名证书指纹（没配就只把实际值打印出来）
          GS_EXPECT_CERT_SHA256: ${{ secrets.GS_CERT_SHA256 }}
          HAVE_KEYSTORE: ${{ secrets.GS_KEYSTORE_BASE64 }}
        run: |
          EXTRA=()
          if [ -n "${HAVE_KEYSTORE:-}" ]; then
            # 配了签名密钥 —— release 包就不该再是 debug 签名，踩到直接红。
            # 前提是上面「解码签名密钥」那步真的把 GS_KEYSTORE_PATH 交给了 Gradle；
            # 少了它这里必然红（这是设计如此：宁可红，不要签出一个「签名和以前不一样」
            # 的包让所有已装用户卸载重装）。
            echo "已配置签名密钥：release 包不允许退回 debug 签名"
            EXTRA+=(--reject-debug-cert)
          else
            echo "未配置签名密钥（零密钥 CI）：release 包会用 debug 签名，只提醒不报错"
          fi

          APKS=(app/build/outputs/apk/release/app-release.apk)
          # debug 包只在手动勾选时才有。有就一并过一遍 —— 它和 release 共用同一个
          # keystore，坏掉一样装不上。
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APKS+=(app/build/outputs/apk/debug/app-debug.apk)
          fi

          python3 tools/ci/verify_apk.py "${EXTRA[@]}" "${APKS[@]}"

      - name: 整理产物
        # 就算上面红线校验红了，也要把 APK 留下来 —— 那正是排查时要看的东西
        if: always()
        run: |
          mkdir -p dist
          VC="${{ steps.ver.outputs.vc }}"
          VN="${{ steps.ver.outputs.vn }}"
          for t in release debug; do
            src="app/build/outputs/apk/$t/app-$t.apk"
            if [ ! -f "$src" ]; then
              echo "跳过 $t（没有 $src）"
              continue
            fi
            suffix=""
            if [ "$t" = "debug" ]; then
              suffix="-debug"
            fi
            cp "$src" "dist/GSAuxiliary_${VC}-${VN}${suffix}.apk"
          done
          # R8 的混淆映射：release 崩溃栈要靠它还原成可读的类名 / 行号
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          ls -l dist || true

          {
            echo "## 构建产物"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in dist/*.apk dist/mapping.txt; do
              [ -f "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(( $(wc -c < "$f") / 1024 )) KB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        if: always()
        # v7 起跑在 Node 24。v5 是 node20 的，runner 会强制用 Node 24 跑它并
        # 在每次运行上挂一条弃用警告 —— 别退回 v5。
        uses: actions/upload-artifact@v7
        with:
          name: GSAuxiliary_${{ steps.ver.outputs.vc }}-${{ steps.ver.outputs.vn }}
          path: dist/*
          # 构建阶段就失败时 dist 是空的 —— 那是上游已经报过的错，不用在这儿再报一次
          if-no-files-found: ignore
          retention-days: 14
