# GitLab 的「描述模板」。字段类型见 bug_report.yml 顶部的说明
# （GitLab 只认 markdown / input / dropdown / textarea，且不支持必填与 checkboxes）。
name: 功能建议
description: 想要新功能，或者希望某个地方更好用
labels: ["功能增强"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可以先翻翻已有的 Issue，避免重复；
        功能页里已经有的开关也请先确认一下没被漏掉。

        > 本模块只做界面显示与操作便捷的增强，不涉及自动化交易、荐股或任何违规用途。

  - type: textarea
    id: problem
    attributes:
      label: 什么场景不顺手（请填全）
      description: |
        先说场景再说想法——「在金太阳的 xx 页面，我想做 xx，但现在要 xx 步 / 看不到 xx」。
        场景越具体，越容易判断该不该做、怎么做。
      placeholder: |
        例：
        在策略详情页想快速看某只股票的行情，
        现在要点进二级页面再点一次标准行情，多了一层。

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果（可选）
      description: 有参考就更好——比如金太阳或别的 App 里类似的做法

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 金太阳里对应页面的截图、金太阳版本号等
