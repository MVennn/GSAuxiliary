# GitLab 的「描述模板」。
#
# ⚠️ 字段写法与 GitHub 的同名模板**不一样**，别照抄：
#   · GitHub：required 写在 `validations: {required: true}`
#   · GitLab：required 写在 **`attributes:` 里面**（`validations` 那一段 GitLab 不认，
#     整份模板会被**静默忽略** —— 页面上「添加描述模板」那里就不见了）
#   · GitLab 不支持 `render: shell`
#
# 这份与 `.github/ISSUE_TEMPLATE/bug_report.yml` 内容一致，但**字段位置不同**。
name: 问题反馈（Bug）
description: 开关失灵、显示异常、模块崩溃等问题
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面的信息填全，尤其是 **LSPosed 日志**——
        没有日志的问题很难定位，多半只能来回追问。

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: 反馈前确认
      description: 本模块仅供学习研究，请知悉以下事项后再提交。
      options:
        - label: 我已知悉本模块会 Hook 国信金太阳，可能违反其用户协议并导致账号风控或封禁，相关风险由我自行承担。
          required: true
        - label: 我已阅读并同意仓库中的免责声明（docs/DISCLAIMER.md），了解开发者不承担因使用本模块产生的任何责任。
          required: true
        - label: 我没读上面的清单，闭眼全选（选了这项就别提了，直接关闭）。

  - type: textarea
    id: what-happened
    attributes:
      label: 出了什么问题
      description: |
        描述现象 + 复现步骤：在哪个页面、点了什么、预期是什么、实际看到什么。
        能稳定复现就写步骤，时有时无就写出现频率。
      placeholder: |
        例：
        1. 打开金太阳，进入策略详情页
        2. 点右上角「筛选股票」，筛选后返回
        3. 预期：列表正常显示；实际：整页空白
      required: true

  - type: input
    id: gsx-version
    attributes:
      label: 国信金太阳版本号
      description: 金太阳「我的 → 设置 → 关于」里能看到
      placeholder: "例：8.6.0"
      required: true

  - type: input
    id: module-version
    attributes:
      label: 模块版本号
      description: GSAuxiliary「关于」页里能看到
      placeholder: "例：3.3.0（versionCode 48）"
      required: true

  - type: input
    id: device
    attributes:
      label: 机型与安卓版本
      placeholder: "例：Redmi K60 / Android 14"
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: LSPosed 作用域里「国信金太阳」勾了吗
      description: 报问题前先确认这一步——没勾作用域模块不会生效
      options:
        - 已勾选，且强制停止金太阳后重开过
        - 没勾 / 不确定
      required: true

  - type: textarea
    id: lsposed-log
    attributes:
      label: LSPosed 日志
      description: |
        电脑连上手机后执行这条命令，把输出整段贴进来：

        ```
        adb shell su -c "grep GSZXEnhance /data/adb/lspd/log/modules_*.log | tail -50"
        ```

        没法抓日志的话，说明一下原因（比如问题发生在另一台设备上）。

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏（可选）
      description: 界面类问题一图胜千言
