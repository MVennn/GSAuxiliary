# GitLab 的「描述模板」。
#
# ⚠️ 字段写法与 GitHub 的同名模板**不一样**，别照抄：
#   · GitLab 只认四种类型：**markdown / input / dropdown / textarea**
#     （GitHub 的 `checkboxes` 在 GitLab 没有 → 整份模板被**静默忽略**）
#   · GitLab 的描述模板**不支持必填**（GitHub 那个 `validations: {required: true}`
#     在 GitLab 同样会让模板失效；`required` 写在 `attributes` 里也不认）
#   · `render: shell` 是 GitHub 专有的
#
# 所以「必填」这件事只能靠**文案**（写明「请尽量填全」）+ 下拉选项来引导。
# 这份与 `.github/ISSUE_TEMPLATE/bug_report.yml` 内容一致，但**字段类型不同**。
name: 问题反馈（Bug）
description: 开关失灵、显示异常、模块崩溃等问题
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面的信息填全，尤其是 **LSPosed 日志**——
        没有日志的问题很难定位，多半只能来回追问。

        > 本模块仅供学习研究，请知悉：它会 Hook 国信金太阳，可能违反其用户协议
        > 并导致账号风控或封禁，相关风险由你自己承担；开发者不承担因使用本模块
        > 产生的任何责任（详见仓库 docs/DISCLAIMER.md）。

  - type: textarea
    id: what-happened
    attributes:
      label: 出了什么问题（请填全）
      description: |
        描述现象 + 复现步骤：在哪个页面、点了什么、预期是什么、实际看到什么。
        能稳定复现就写步骤，时有时无就写出现频率。
      placeholder: |
        例：
        1. 打开金太阳，进入策略详情页
        2. 点右上角「筛选股票」，筛选后返回
        3. 预期：列表正常显示；实际：整页空白

  - type: input
    id: gsx-version
    attributes:
      label: 国信金太阳版本号（必填）
      description: 金太阳「我的 → 设置 → 关于」里能看到
      placeholder: "例：8.6.0"

  - type: input
    id: module-version
    attributes:
      label: 模块版本号（必填）
      description: GSAuxiliary「关于」页里能看到
      placeholder: "例：3.3.0（versionCode 48）"

  - type: input
    id: device
    attributes:
      label: 机型与安卓版本（必填）
      placeholder: "例：Redmi K60 / Android 14"

  - type: dropdown
    id: scope
    attributes:
      label: LSPosed 作用域里「国信金太阳」勾了吗
      description: 报问题前先确认这一步——没勾作用域模块不会生效
      options:
        - 已勾选，且强制停止金太阳后重开过
        - 没勾 / 不确定

  - type: textarea
    id: lsposed-log
    attributes:
      label: LSPosed 日志
      description: |
        电脑连上手机后执行这条命令，把输出整段贴进来：

        ```
        adb shell su -c "grep GSZXEnhance /data/adb/lspd/log/modules_*.log | tail -50"
        ```

        没法抓日志的话，说明一下原因（比如问题发生在另一台设备上）。

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏（可选）
      description: 界面类问题一图胜千言
